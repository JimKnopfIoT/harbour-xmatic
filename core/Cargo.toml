[package]
name = "xmatic-core"
# Follows the package version in rpm/harbour-xmatic.spec. `xm_version()` hands
# this out and the app logs it at startup, so a tester's first log line names
# the build they are on — it read "0.2.0" for eleven releases because this was
# never moved, which cost a round of chasing a version that was not the problem.
version = "0.28.3"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Matrix protocol core for xmatic, exposed over a C ABI"

[lib]
name = "xmatic_core"
# staticlib only: the final link happens inside the Sailfish SDK against the
# device sysroot, so cargo never needs a cross linker of its own.
crate-type = ["staticlib"]

[dependencies]
# Pinned exactly: the SDK's API moves between releases, and this project has no
# CI to catch drift. Cargo.lock is committed for the same reason.
# TLS is rustls throughout — no OpenSSL, so nothing has to match the device's
# libssl. SQLite is compiled from bundled sources instead of linking the
# device's library, which keeps the cross build self-contained.
matrix-sdk = { version = "=0.18.0", default-features = false, features = [
    # The message search: a Tantivy index per room, filled by the event cache
    # as events arrive and encrypted on disk under the store key. Experimental
    # in the SDK's own naming, and the only local full-text search there is -
    # the server cannot search an encrypted room, so a server-side one would
    # work in exactly the rooms this app does not have. Costs ~1.5 MiB in the
    # package, measured.
    "experimental-search",
    "local-server",
    "e2e-encryption",
    "sqlite",
    "bundled-sqlite",
    # Two mechanisms in one feature: this device asking its *own* verified
    # devices for a Megolm key it lacks, and answering such a request. Without
    # it neither exists - the flags and even their setters sit behind this
    # `cfg` in matrix-sdk-crypto, so it could not be turned on at run time
    # either, and a message that arrived without its key had no second chance
    # on a device whose owner also runs another one.
    #
    # The sharing half is narrower than its name: `should_share_key` gives a
    # whole session only to an own *verified* device, re-shares to somebody
    # else's device only from the index it was already given, and refuses
    # anything it has no record of. Nobody receives what they never had.
    #
    # What it costs in metadata, because that is not nothing: the request is an
    # unencrypted to-device event to all of this account's own devices, naming
    # the room, the session and the asking device. The homeserver therefore
    # learns "device D of U could not decrypt session S in room R at time T"
    # whenever a message arrives without its key. It is sent only where at least
    # one *other* own device is verified - a single-device account produces none
    # of this - and duplicates are suppressed in the crypto store.
    "automatic-room-key-forwarding",
] }
matrix-sdk-ui = "=0.18.0"
# UnifiedPush, the connector half. The reference client rather than a
# hand-rolled protocol; the distributor is a separate app on the device, so
# this brings no daemon of its own into a client that deliberately has none.
#
# `zbus` is named directly because its connection has to be driven by
# `zbus::block_on` on a thread of its own. The crate's D-Bus handlers call
# `Handle::block_on`, which is legal only on zbus's async-io executor - polled
# from a tokio worker they panic with "Cannot start a runtime from within a
# runtime", the same message this project already met on the Gemini for a
# different reason. And **`zbus/tokio` must never be enabled anywhere in this
# crate's dependency graph**: Cargo unifies features, so one such dependency
# would move the executor and break it from a distance.
unifiedpush = "0.1"
unifiedpush_storage = "0.1"
zbus = "5"
# The UnifiedPush traits are async and not yet `dyn`-compatible without it.
async-trait = "0.1"
# Only for `UtdCause`: the timeline hands the reason a message could not be
# decrypted over as this type, and neither matrix-sdk nor matrix-sdk-ui
# re-exports it. The crate is already in the tree as a dependency of both, and
# it is pinned to the same version, so nothing new is pulled in.
matrix-sdk-base = { version = "=0.18.0", default-features = false, features = [
    "e2e-encryption",
] }
# For the device-code login (RFC 8628), which the SDK only wires up for its
# QR flow. Versions mirror what the SDK already pulls in, so nothing new
# enters the tree; reqwest stays rustls-only like everything else.
oauth2 = { version = "=5.0.0", default-features = false }
oauth2-reqwest = "=0.1.0-alpha.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# `sync` is used directly (mpsc, Mutex, RwLock, Semaphore) and was only
# compiling because the SDK happens to switch it on. A dependency on another
# crate's feature choice is not a dependency.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"
mime = "0.3"
# Wipes the password login's owned copies on drop. Already in the tree as a
# dependency of the SDK's crypto crates; pinned to the version the lock file
# resolved for them.
zeroize = "=1.9.0"
# Encrypts session.json with the store key from Sailfish Secrets — the same
# cipher the SDK's SQLite stores use internally. Already in the tree via
# matrix-sdk-sqlite; base64 carries the key across the C ABI and wraps the
# envelope fields. Both pinned to what the lock file already resolved.
# Parses a message's `formatted_body` before it is rewritten into the small
# markup subset Qt can draw (core/src/markup.rs). Already in the tree as a
# dependency of the SDK's message types, and pinned to the version the lock
# file resolved for them, so nothing new enters the build.
ruma-html = "=0.8.0"
matrix-sdk-store-encryption = "=0.18.0"
base64 = "=0.22.1"
# Names the files in the media cache (core/src/media.rs). Both are already
# in the tree via the SDK and pinned to what the lock file resolved.
sha2 = "=0.10.9"
hex = "=0.4.3"

[profile.release]
lto = "thin"
codegen-units = 1
# Deliberately NOT panic = "abort": the FFI boundary catches unwinds so a panic
# in the core surfaces as an error message instead of killing the UI process.
panic = "unwind"
overflow-checks = true
